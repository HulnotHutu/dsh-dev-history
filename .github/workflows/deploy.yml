name: deploy
# 复制到发布仓库的 .github/workflows/deploy.yml。
# 发布仓库保留本项目的目录结构时 path 用 site；若把 site/ 内容放在仓库根，改为 path: '.'
# 当前 Pages 源为 gh-pages 分支（Deploy from a branch），本工作流仅手动触发；
# 若在 Settings → Pages 把源切到 GitHub Actions，把 push 触发加回来即可改为推送即部署：
# on:
#   push:
#     branches: [main, master]
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
